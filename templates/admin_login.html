<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | SECOPS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #08111f;
            color: #e5eef8;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 360px;
            padding: 35px;
            background: #0d1826;
            border: 1px solid #1f3448;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #00ff88;
        }

        .subtitle {
            text-align: center;
            color: #9fb0c0;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #c9d4df;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #08111f;
            color: white;
            border: 1px solid #1f3448;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #00ff88;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            color: #04110b;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #9fb0c0;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>SECOPS.</h1>

        <p class="subtitle">Private Admin Panel</p>

        <form method="POST">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a href="/" class="back-link">
            ← Back to Website
        </a>

    </div>

</body>
</html>
